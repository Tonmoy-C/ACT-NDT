[project]
name = "ai-telco-engineer-framework"
version = "0.2.0"
description = "LLM/RL agent architectures for wireless link adaptation - PHY baseline through evolutionary and neural-receiver optimization"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0,<7.0",
    "numpy>=2.0,<3.0",
    "pandas>=2.2,<4.0",
    "scikit-learn>=1.5,<2.0",
    "tqdm>=4.66,<5.0",
    "matplotlib>=3.9,<4.0",
    "requests>=2.31,<3.0",
    "torch>=2.4,<3.0",
]

[project.optional-dependencies]
stats = ["scipy>=1.13,<2.0"]
dev = ["scipy>=1.13,<2.0", "pytest>=8.0,<9.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "config_loader", "phy_models", "base_env", "base_reflexion_policy",
    "llm_client", "cost_logger", "dqn_baseline",
    "scenario1_baseline", "scenario2_react_agents", "scenario3_multicell_icic",
    "scenario4_mobility_blockage", "scenario5_evo_optimizer", "scenario6_neural_rx",
    "scenario7_cost_analysis", "run_multiseed",
]
